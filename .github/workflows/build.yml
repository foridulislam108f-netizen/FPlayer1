name: Build FPlayer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # রিপোতে zip আপলোড হয়ে থাকলে নিজে থেকেই খুলে নেবে
      - name: Extract uploaded zip (if needed)
        run: |
          if [ -z "$(find . -maxdepth 4 -name settings.gradle -not -path './.git/*' | head -n 1)" ]; then
            z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then
              echo "Extracting $z"
              mkdir -p _project
              unzip -q -o "$z" -d _project
            fi
          fi

      - name: Locate Gradle project
        id: locate
        run: |
          f=$(find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle পাওয়া যায়নি। রিপোর ফাইল স্ট্রাকচার:"
            find . -maxdepth 3 -not -path './.git/*' | head -100
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Gradle project dir: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp "${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" FPlayer.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FPlayer-apk
          path: FPlayer.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FPlayer build ${{ github.run_number }}
          files: FPlayer.apk
